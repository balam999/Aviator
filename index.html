<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Camera App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* ক্লিক করলে নীল বা অন্য কোনো হাইলাইট কালার আসার সমস্যা দূর করার জন্য */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }
        body {
            background-color: #0b0b0b;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        /* টপ মোড সিলেকশন বার */
        .top-bar {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 30px;
            z-index: 20;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .mode-tab {
            background: none;
            border: none;
            color: #888;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.3s ease;
            outline: none;
        }
        .mode-tab.active-photo {
            background: #ffffff;
            color: #000000;
        }
        .mode-tab.active-video {
            background: #ff3b30;
            color: #ffffff;
        }

        /* ক্যামেরা প্রিভিউ স্ক্রিন */
        .viewfinder {
            position: relative;
            width: 100%;
            height: 75vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas {
            display: none;
        }

        /* রেকর্ডিং স্ট্যাটাস ইন্ডিকেটর */
        .rec-indicator {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 59, 48, 0.85);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            display: none;
            z-index: 15;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* কন্ট্রোল প্যানেল */
        .controls {
            height: 25vh;
            background: #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 25px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* গ্যালারি প্রিভিউ থাম্বনেইল বাটন (বাম পাশে) */
        .gallery-container {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: #1c1c1e;
            border: 2px solid rgba(255,255,255,0.2);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .gallery-container:active {
            transform: scale(0.92);
        }
        .gallery-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .gallery-placeholder {
            font-size: 10px;
            color: #777;
            text-align: center;
        }

        /* মূল শার্টার বাটন */
        .shutter-btn-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
        }
        .shutter-outer {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }
        .shutter-inner {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        /* ভিডিও মোড সিলেক্ট হলে শার্টার ডিজাইনে পরিবর্তন এবং লাল কালার */
        .video-mode-active .shutter-outer {
            border-color: #ff3b30;
        }
        .video-mode-active .shutter-inner {
            background: #ff3b30;
            border-radius: 50%; /* পুরোপুরি গোল শেপ */
            width: 62px;        /* সাইজ পুরো ফিলাপ থাকবে */
            height: 62px;
        }

        /* ক্লিক করার সাথে সাথে রিয়েল ক্যামেরার মতো জুম আউট বা নিচে চেপে যাওয়ার অ্যানিমেশন */
        .shutter-btn-wrapper:active .shutter-outer {
            transform: scale(0.88);
        }
        .shutter-btn-wrapper:active .shutter-inner {
            transform: scale(0.82);
        }

        /* ক্যামেরা ফ্লিপ বাটন (ডান পাশে) */
        .switch-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #1c1c1e;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            outline: none;
        }
        .switch-btn:active {
            transform: scale(0.9);
        }
        .switch-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="mode-tab active-photo" id="photoModeTab">PHOTO</button>
        <button class="mode-tab" id="videoModeTab">VIDEO</button>
    </div>

    <div class="viewfinder">
        <div class="rec-indicator" id="recIndicator">● REC 00:00</div>
        <video id="cameraStream" autoplay playsinline></video>
        <canvas id="captureCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="gallery-container" id="galleryBtn" title="View Media">
            <span class="gallery-placeholder" id="galleryText">Media</span>
            <img id="thumbImg" class="gallery-thumb" alt="Preview">
        </div>

        <div class="shutter-btn-wrapper" id="shutterWrapper">
            <div class="shutter-outer" id="shutterOuter">
                <div class="shutter-inner" id="shutterInner"></div>
            </div>
        </div>

        <button class="switch-btn" id="switchCameraBtn" title="Switch Camera">
            <svg viewBox="0 0 24 24">
                <path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
        </button>
    </div>

    <a id="downloadAnchor" style="display:none;"></a>

    <script>
        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('captureCanvas');
        const shutterWrapper = document.getElementById('shutterWrapper');
        const photoModeTab = document.getElementById('photoModeTab');
        const videoModeTab = document.getElementById('videoModeTab');
        const switchBtn = document.getElementById('switchCameraBtn');
        const thumbImg = document.getElementById('thumbImg');
        const galleryText = document.getElementById('galleryText');
        const recIndicator = document.getElementById('recIndicator');

        let currentStream = null;
        let useFrontCamera = false;
        let currentMode = 'photo'; 
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let lastMediaUrl = null;

        // ক্যামেরা স্টার্ট করার ফাংশন
        async function startCamera(front = false) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            const constraints = {
                video: { facingMode: front ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: true
            };
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                alert("ক্যামেরা পারমিশন পাওয়া যায়নি বা ক্যামেরা ব্লক করা আছে!");
                console.error(err);
            }
        }

        // মোড সুইচিং লজিক (PHOTO / VIDEO)
        photoModeTab.addEventListener('click', () => {
            if(isRecording) return; 
            currentMode = 'photo';
            photoModeTab.className = 'mode-tab active-photo';
            videoModeTab.className = 'mode-tab';
            shutterWrapper.classList.remove('video-mode-active');
        });

        videoModeTab.addEventListener('click', () => {
            currentMode = 'video';
            videoModeTab.className = 'mode-tab active-video';
            photoModeTab.className = 'mode-tab';
            shutterWrapper.classList.add('video-mode-active');
        });

        // শার্টার বাটনে ক্লিক
        shutterWrapper.addEventListener('click', () => {
            if (currentMode === 'photo') {
                takePhoto();
            } else {
                toggleVideoRecording();
            }
        });

        // ছবি তোলার ফাংশন
        function takePhoto() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageDataUrl = canvas.toDataURL('image/jpeg');
            lastMediaUrl = imageDataUrl;
            
            thumbImg.style.display = 'block';
            galleryText.style.display = 'none';
            thumbImg.src = imageDataUrl;

            const a = document.getElementById('downloadAnchor');
            a.href = imageDataUrl;
            a.download = `IMG_${Date.now()}.jpg`;
            a.click();
        }

        // ভিডিও রেকর্ডিং শুরু/বন্ধ করার ফাংশন
        function toggleVideoRecording() {
            if (!isRecording) {
                recordedChunks = [];
                try {
                    mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(currentStream);
                }

                mediaRecorder.ondataavailable = function(e) {
                    if (e.data.size > 0) {
                        recordedChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = function() {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    lastMediaUrl = URL.createObjectURL(blob);
                    
                    galleryText.style.display = 'block';
                    galleryText.innerText = 'VID';
                    thumbImg.style.display = 'none';

                    const a = document.getElementById('downloadAnchor');
                    a.href = lastMediaUrl;
                    a.download = `VID_${Date.now()}.webm`;
                    a.click();
                };

                mediaRecorder.start();
                isRecording = true;
                recIndicator.style.display = 'block';
                photoModeTab.style.opacity = '0.4';
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recIndicator.style.display = 'none';
                photoModeTab.style.opacity = '1';
            }
        }

        // গ্যালারি থাম্বনেইলে ক্লিক
        document.getElementById('galleryBtn').addEventListener('click', () => {
            if (lastMediaUrl) {
                window.open(lastMediaUrl, '_blank');
            } else {
                alert("এখনো কোনো ছবি বা ভিডিও তোলা হয়নি!");
            }
        });

        // ক্যামেরা ফ্লিপ করা (Front / Back)
        switchBtn.addEventListener('click', () => {
            if(isRecording) return;
            useFrontCamera = !useFrontCamera;
            startCamera(useFrontCamera);
        });

        // অ্যাপ লোড হওয়ার সাথে সাথে ক্যামেরা চালু
        window.addEventListener('load', () => {
            startCamera(useFrontCamera);
        });
    </script>
</body>
</html>
